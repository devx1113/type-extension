<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DeepL Korean Typing</title>
  <style>
    :root { color-scheme: light dark; }
    body { width: 220px; margin: 0; padding: 12px; font: 13px/1.4 system-ui, "Noto Sans CJK KR", sans-serif; }
    fieldset { margin: 0; padding: 0; border: 0; }
    legend { padding: 0; margin-bottom: 6px; font-weight: 600; }
    label { display: flex; align-items: center; gap: 8px; padding: 6px 4px; border-radius: 6px; cursor: pointer; }
    label:hover { background: #8882; }
    p { margin: 8px 0 0; font-size: 11px; opacity: 0.7; }
  </style>
</head>
<body>
  <fieldset>
    <legend>Typing language</legend>
    <label><input type="radio" name="language" value="ko"> 한국어 (Korean)</label>
    <label><input type="radio" name="language" value="en"> English</label>
  </fieldset>
  <p>On deepl.com, Shift+Space also switches the language.</p>
  <script src="popup.js"></script>
</body>
</html>
